<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Asks search engines not to list this page. This is NOT security:
       anyone with the URL can still open it. -->
  <meta name="robots" content="noindex, nofollow">

  <title>My Tools</title>

  <style>
    /* ---- Look and feel (safe to ignore; change colors here if you like) ---- */
    body {
      font-family: system-ui, sans-serif;
      background: #f4f5f7;
      color: #222;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    h1 { font-size: 1.5rem; text-align: center; }
    ul { list-style: none; padding: 0; }
    li { margin: 12px 0; }
    a {
      display: block;              /* makes the whole box tappable on a phone */
      padding: 16px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
      color: #0b5cad;
      text-decoration: none;
      font-size: 1.1rem;
    }
    a:hover { background: #e8f0fa; }
    small { display: block; color: #666; font-size: .85rem; margin-top: 4px; }
    footer { text-align: center; color: #888; font-size: .8rem; margin-top: 32px; }
  </style>
</head>
<body>

  <h1>My Tools</h1>

  <!-- =====================================================================
       HOW TO ADD, CHANGE OR REMOVE A LINK
       Each link is one <li>...</li> block below.
         - To ADD:    copy a whole <li>...</li> block and paste it in the list.
         - To CHANGE: edit the web address inside href="..." and the label text.
         - To REMOVE: delete the whole <li>...</li> block.
       The <small> line is an optional short description; delete it if unwanted.
       Replace each "https://example.com/..." with the real address.
       KEEP LABELS NEUTRAL: this page is public, so avoid wording that reveals
       anything private (e.g. use "Weekly check-in" rather than a diagnosis).
       ===================================================================== -->
  <ul>
    <li><a href="https://example.com/checkin">Weekly check-in<small>Short survey</small></a></li>
    <li><a href="https://example.com/run">Run reminder<small>Schedule and log</small></a></li>
    <li><a href="https://example.com/coach">Self-coach<small>Coaching app</small></a></li>
    <li><a href="https://example.com/journal">Work journal<small>Daily notes</small></a></li>
  </ul>

  <footer>Last updated: 2026-11-01</footer>

</body>
</html>
